name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run ci:lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run ci:test

      - name: Build project
        run: npm run ci:build

      - name: Verify dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist folder not found"
            exit 1
          fi
          echo "Build successful: dist folder exists"
