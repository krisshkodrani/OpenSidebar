id: dropdown-select-001
version: "1.0"
created_at: "2025-02-10"
description: Change language in a dropdown select and save settings

input:
  url: https://example.com/settings
  dom_snapshot: |
    <html>
      <head><title>Settings - Example App</title></head>
      <body>
        <header>
          <h1>Settings</h1>
          <nav>
            <a href="/dashboard" id="dashboard-link">Dashboard</a>
            <a href="/settings" id="settings-link" class="active">Settings</a>
          </nav>
        </header>
        <main>
          <form id="settings-form">
            <div class="form-group">
              <label for="language-select">Language</label>
              <select id="language-select" name="language">
                <option value="en" selected>English</option>
                <option value="es" id="option-spanish">Spanish</option>
                <option value="fr" id="option-french">French</option>
                <option value="de" id="option-german">German</option>
              </select>
            </div>
            <div class="form-group">
              <label for="timezone-select">Timezone</label>
              <select id="timezone-select" name="timezone">
                <option value="utc" selected>UTC</option>
                <option value="est">Eastern</option>
                <option value="pst">Pacific</option>
              </select>
            </div>
            <button type="submit" id="save-btn" class="btn-primary">Save</button>
          </form>
        </main>
      </body>
    </html>
  user_query: "Change the language to French and save"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: click_element
      params:
        id: 3
      reasoning: Click the language select dropdown to open it
      optional: true

    - tool: click_element
      params:
        id: 5
      reasoning: Select the French option from the language dropdown
      optional: false

    - tool: click_element
      params:
        id: 8
      reasoning: Click the Save button to persist the language change
      optional: false

  assistant_text_pattern: "*French*save*"
  outcome:
    success: true

metadata:
  tags:
    - dropdown
    - select
    - form
    - settings
    - multi-step
  difficulty: medium
  expected_steps: 3
  category: form
