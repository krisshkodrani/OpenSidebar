id: form-placeholders-001
version: "1.0"
created_at: "2025-02-10"
description: Fill out a contact form with multiple fields identified by placeholders and submit it

input:
  url: https://example.com/contact
  dom_snapshot: |
    <html>
      <head><title>Contact Us - Example</title></head>
      <body>
        <header>
          <h1>Contact Us</h1>
          <nav>
            <a href="/" id="home-link">Home</a>
            <a href="/contact" id="contact-link" class="active">Contact</a>
          </nav>
        </header>
        <main>
          <form id="contact-form" action="/api/contact" method="POST">
            <div class="form-group">
              <label for="name-input">Name</label>
              <input type="text" id="name-input" name="name" placeholder="Your name" required/>
            </div>
            <div class="form-group">
              <label for="email-input">Email</label>
              <input type="email" id="email-input" name="email" placeholder="Email address" required/>
            </div>
            <div class="form-group">
              <label for="message-input">Message</label>
              <textarea id="message-input" name="message" placeholder="Your message" rows="5" required></textarea>
            </div>
            <button type="submit" id="submit-btn" class="btn-primary">Submit</button>
          </form>
        </main>
      </body>
    </html>
  user_query: "Fill out the contact form with name 'John Doe', email 'john@example.com', and message 'Hello there'"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: click_element
      params:
        id: 3
      reasoning: Focus the name input field before typing
      optional: true

    - tool: type_text
      params:
        id: 3
        text: "John Doe"
      reasoning: Enter the name into the name field
      optional: false

    - tool: click_element
      params:
        id: 4
      reasoning: Focus the email input field before typing
      optional: true

    - tool: type_text
      params:
        id: 4
        text: "john@example.com"
      reasoning: Enter the email address into the email field
      optional: false

    - tool: click_element
      params:
        id: 5
      reasoning: Focus the message textarea before typing
      optional: true

    - tool: type_text
      params:
        id: 5
        text: "Hello there"
      reasoning: Enter the message into the message textarea
      optional: false

    - tool: click_element
      params:
        id: 6
      reasoning: Click the Submit button to send the contact form
      optional: false

  assistant_text_pattern: "*contact form*John Doe*submit*"
  outcome:
    success: true

metadata:
  tags:
    - forms
    - text-input
    - multi-step
    - placeholders
    - textarea
  difficulty: medium
  expected_steps: 4
  category: form
