id: hover-menu-001
version: "1.0"
created_at: "2025-02-10"
description: Hover over a navigation menu item to reveal dropdown options

input:
  url: https://example.com/app
  dom_snapshot: |
    <html>
      <head><title>Example App</title></head>
      <body>
        <header>
          <nav class="main-nav" role="menubar">
            <a href="/" id="nav-home" role="menuitem">Home</a>
            <div class="dropdown" id="products-dropdown">
              <a href="/products" id="nav-products" role="menuitem" aria-haspopup="true" aria-expanded="false">Products</a>
              <div class="dropdown-menu" role="menu" style="display:none;">
                <a href="/products/software" id="menu-software" role="menuitem">Software</a>
                <a href="/products/hardware" id="menu-hardware" role="menuitem">Hardware</a>
                <a href="/products/services" id="menu-services" role="menuitem">Services</a>
              </div>
            </div>
            <div class="dropdown" id="solutions-dropdown">
              <a href="/solutions" id="nav-solutions" role="menuitem" aria-haspopup="true" aria-expanded="false">Solutions</a>
              <div class="dropdown-menu" role="menu" style="display:none;">
                <a href="/solutions/enterprise" id="menu-enterprise" role="menuitem">Enterprise</a>
                <a href="/solutions/startup" id="menu-startup" role="menuitem">Startup</a>
              </div>
            </div>
            <a href="/pricing" id="nav-pricing" role="menuitem">Pricing</a>
            <a href="/contact" id="nav-contact" role="menuitem">Contact</a>
          </nav>
        </header>
        <main>
          <h1>Welcome to Example App</h1>
          <p>Explore our products and solutions designed to help your business grow.</p>
        </main>
      </body>
    </html>
  user_query: "Hover over the Products menu to see the options"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: hover_element
      params:
        id: 2
      reasoning: Hover over the Products menu item to trigger the dropdown and reveal the submenu options
      optional: false

  assistant_text_pattern: "*Products*hover*"
  outcome:
    success: true

metadata:
  tags:
    - hover
    - dropdown-menu
    - navigation
    - interaction
  difficulty: medium
  expected_steps: 1
  category: interaction
