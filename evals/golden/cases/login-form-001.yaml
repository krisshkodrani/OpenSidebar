id: login-form-001
version: "1.1"
created_at: "2024-01-15"
updated_at: "2025-02-10"
description: Simple login form submission

input:
  url: https://example.com/login
  dom_snapshot: |
    <html>
      <head><title>Login - Example</title></head>
      <body>
        <div class="login-form">
          <h2>Login</h2>
          <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"/>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"/>
            <button type="submit" id="login-btn">Log In</button>
          </form>
        </div>
      </body>
    </html>
  user_query: "Log in with username 'testuser' and password 'secret123'"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: click_element
      params:
        id: 1
      reasoning: Focus the username input field
      optional: true
    - tool: type_text
      params:
        id: 1
        text: "testuser"
      reasoning: Enter the username
    - tool: click_element
      params:
        id: 2
      reasoning: Focus the password input field
      optional: true
    - tool: type_text
      params:
        id: 2
        text: "secret123"
        pressEnter: true
      reasoning: Enter the password and submit via Enter
    - tool: click_element
      params:
        id: 3
      reasoning: Submit the login form
      optional: true
  assistant_text_pattern: "I'll log you in with the provided credentials"
  outcome:
    success: true

metadata:
  tags:
    - forms
    - authentication
    - text-input
    - multi-step
  difficulty: medium
  expected_steps: 3
  category: form-interaction
