id: memory-conversation-context-001
version: "1.1"
created_at: "2024-02-10"
updated_at: "2025-02-10"
description: |
  Complex scenario: Agent maintains context across conversation turns.
  User provides information in chat, then asks follow-up questions that
  require recalling previous context. Agent should search memory and
  provide personalized responses.
  Tests: memory_search, context_maintenance, personalized_response

input:
  url: https://chat.example.com
  dom_snapshot: |
    <html>
      <head><title>Chat - Example</title></head>
      <body>
        <div id="chat-container">
          <div id="chat-history">
            <div class="message user">
              <p>My name is Alice and I work at TechCorp</p>
            </div>
            <div class="message assistant">
              <p>Nice to meet you, Alice! I've noted that you work at TechCorp.</p>
            </div>
          </div>
          <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a message..."/>
            <button id="send-btn">Send</button>
          </div>
        </div>
      </body>
    </html>
  user_query: "What was my name again? Also, do you know where my office is?"
  viewport:
    width: 1280
    height: 720

# Pre-populate memory with user profile from earlier conversation
mock_memory:
  - id: "mem-201"
    content: "User name is Alice Johnson"
    category: "user_profile"
    sourceUrl: "https://chat.example.com"
    createdAt: 1704067200000
  - id: "mem-202"
    content: "User works at TechCorp as a Product Manager"
    category: "user_profile"
    sourceUrl: "https://chat.example.com"
    createdAt: 1704067200000
  - id: "mem-203"
    content: "TechCorp office address: 123 Innovation Drive, San Francisco, CA 94105"
    category: "user_profile"
    sourceUrl: "https://chat.example.com"
    createdAt: 1704067200000
  - id: "mem-204"
    content: "User prefers to be called Alice (not Alison or Alyssa)"
    category: "user_preferences"
    sourceUrl: "https://chat.example.com"
    createdAt: 1704067200000

expected:
  tool_calls:
    - tool: memory_search
      params:
        query: "Alice user name office address TechCorp"
      reasoning: |
        Search memory for user identity and office location information.
        The user is asking follow-up questions that require recalling
        previous conversation context.
      optional: false

    - tool: click_element
      params:
        id: 1
      reasoning: |
        Focus the message input field to respond.
      optional: true

    - tool: type_text
      params:
        id: 1
        text: "Your name is Alice Johnson! You work at TechCorp, and your office is located at 123 Innovation Drive, San Francisco, CA 94105."
      reasoning: |
        Provide personalized response incorporating both the user's name
        and office location retrieved from memory.
      optional: false

    - tool: click_element
      params:
        id: 2
      reasoning: |
        Send the message to complete the response.
      optional: true

    - tool: memory_add
      params:
        content: "User asked for name and office location confirmation - confirmed both details from memory"
        category: "conversation_log"
      reasoning: |
        Log this interaction to show the memory system is working correctly
        and user is engaging with context-aware responses.
      optional: true

  assistant_text_pattern: |
    *Alice*TechCorp*123 Innovation Drive*San Francisco*

  outcome:
    success: true
    page_contains: "chat"

metadata:
  tags:
    - memory
    - memory_search
    - memory_add
    - conversation_context
    - user_profile
    - personalization
    - context_recall
    - multi-step
  difficulty: medium
  expected_steps: 3
  category: memory-integration
