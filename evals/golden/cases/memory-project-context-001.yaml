id: memory-project-context-001
version: "1.0"
created_at: "2024-02-10"
description: |
  Complex scenario: Agent recalls project details from memory to continue work.
  User asks to continue a project, agent should search memory for context,
  then navigate to the correct location and update memory with new progress.
  Tests: memory_search, context recall, navigation, memory_add

input:
  url: https://google.com
  dom_snapshot: |
    <html>
      <head><title>Google</title></head>
      <body>
        <div class="search-container">
          <input type="text" id="search-input" name="q" placeholder="Search Google"/>
          <button id="search-btn">Google Search</button>
        </div>
      </body>
    </html>
  user_query: "Continue working on the OpenSidebar website redesign project"
  viewport:
    width: 1280
    height: 720

# Pre-populate memory with project context
mock_memory:
  - id: "mem-101"
    content: "OpenSidebar website redesign project: React + Tailwind CSS + TypeScript, GitHub repo: github.com/OpenSidebar/OpenSidebar"
    category: "project_info"
    sourceUrl: "https://github.com/OpenSidebar/OpenSidebar"
    createdAt: 1704067200000
  - id: "mem-102"
    content: "Last worked on: Hero section design, need to implement dark mode toggle"
    category: "project_tasks"
    sourceUrl: "https://github.com/OpenSidebar/OpenSidebar"
    createdAt: 1704153600000
  - id: "mem-103"
    content: "Pending tasks: 1) Dark mode toggle, 2) Mobile responsive nav, 3) Add testimonials section"
    category: "project_tasks"
    sourceUrl: "https://github.com/OpenSidebar/OpenSidebar"
    createdAt: 1704153600000

expected:
  tool_calls:
    - tool: memory_search
      params:
        query: "OpenSidebar website redesign project context"
      reasoning: |
        Search memory for project details: repository location, tech stack,
        current tasks, and what was last worked on.
      optional: false

    - tool: navigate
      params:
        url: "https://github.com/OpenSidebar/OpenSidebar"
      reasoning: |
        Navigate directly to the GitHub repository found in memory.
        This is more efficient than searching again.
      optional: false

    - tool: read_page
      params: {}
      reasoning: |
        Read the current state of the repository to see recent changes
        and understand what's been done since last session.
      optional: false

    - tool: memory_add
      params:
        content: "Resuming OpenSidebar project work. Priority: Implement dark mode toggle in Hero section"
        category: "project_updates"
      reasoning: |
        Log the continuation of work and the immediate priority task.
        This maintains project continuity across sessions.
      optional: true

  assistant_text_pattern: |
    *OpenSidebar*dark mode*GitHub*

  outcome:
    success: true
    page_url_pattern: "github.com"
    page_contains: "opensidebar"

metadata:
  tags:
    - memory
    - memory_search
    - memory_add
    - project_context
    - navigation
    - context_recall
    - multi-step
  difficulty: hard
  expected_steps: 4
  category: memory-integration
