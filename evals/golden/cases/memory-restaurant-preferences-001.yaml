id: memory-restaurant-preferences-001
version: "1.1"
created_at: "2024-02-10"
updated_at: "2025-02-10"
description: |
  Complex scenario: Agent retrieves user's dietary preferences from memory
  before searching, then incorporates those preferences into the search query.
  Tests: memory_search, context integration, memory_add

input:
  url: https://google.com
  dom_snapshot: |
    <html>
      <head><title>Google</title></head>
      <body>
        <div class="search-container">
          <input type="text" id="search-input" name="q" placeholder="Search Google"/>
          <button id="search-btn">Google Search</button>
        </div>
      </body>
    </html>
  user_query: "Find me Italian restaurants in Boston"
  viewport:
    width: 1280
    height: 720

# Pre-populate memory with user's preferences
mock_memory:
  - id: "mem-001"
    content: "User is vegetarian and prefers gluten-free options"
    category: "dietary_preferences"
    sourceUrl: "https://example.com/past-conversation"
    createdAt: 1704067200000
  - id: "mem-002"
    content: "User's favorite Italian dish is eggplant parmesan"
    category: "food_preferences"
    sourceUrl: "https://example.com/past-conversation"
    createdAt: 1704067200000
  - id: "mem-003"
    content: "User previously searched for restaurants in Boston area"
    category: "search_history"
    sourceUrl: "https://google.com"
    createdAt: 1704153600000

expected:
  tool_calls:
    - tool: memory_search
      params:
        query: "Italian restaurants Boston dietary preferences vegetarian"
      reasoning: |
        First, check memory for user's dietary restrictions and food preferences.
        This context is crucial for providing personalized restaurant recommendations.
      optional: false

    - tool: click_element
      params:
        id: 1
      reasoning: |
        Focus the search input field to enter the query.
      optional: true

    - tool: type_text
      params:
        id: 1
        text: "vegetarian gluten-free Italian restaurants Boston"
        pressEnter: true
      reasoning: |
        Type search query incorporating user's dietary preferences found in memory
        and submit via Enter.
      optional: false

    - tool: click_element
      params:
        id: 2
      reasoning: |
        Submit the search by clicking the Google Search button.
      optional: true

    - tool: memory_add
      params:
        content: "User searched for Italian restaurants in Boston - vegetarian and gluten-free options"
        category: "search_history"
      reasoning: |
        Save this search context to memory for future reference and recommendations.
        This helps build a profile of user preferences over time.
      optional: true

  assistant_text_pattern: |
    *vegetarian*gluten-free*Italian*Boston*

  outcome:
    success: true
    page_url_pattern: "google.com/search"
    page_contains: "restaurants"

metadata:
  tags:
    - memory
    - memory_search
    - memory_add
    - context_integration
    - personalization
    - search
    - multi-step
  difficulty: hard
  expected_steps: 3
  category: memory-integration
