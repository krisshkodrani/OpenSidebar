id: navigate-url-001
version: "1.0"
created_at: "2025-02-10"
description: Navigate from Google to Wikipedia by URL

input:
  url: https://google.com
  dom_snapshot: |
    <html>
      <head><title>Google</title></head>
      <body>
        <div class="search-container">
          <img src="/logo.png" alt="Google" />
          <input type="text" id="search-input" name="q" placeholder="Search Google or type a URL"/>
          <button id="search-btn">Google Search</button>
          <button id="lucky-btn">I'm Feeling Lucky</button>
        </div>
        <footer>
          <a href="/about" id="about-link">About</a>
          <a href="/privacy" id="privacy-link">Privacy</a>
          <a href="/terms" id="terms-link">Terms</a>
        </footer>
      </body>
    </html>
  user_query: "Go to wikipedia.org"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: navigate
      params:
        url: "https://wikipedia.org"
      reasoning: Navigate directly to Wikipedia as the user requested
      optional: false

    - tool: read_page
      params: {}
      reasoning: Read the Wikipedia page to confirm successful navigation
      optional: false

  assistant_text_pattern: "*wikipedia*"
  outcome:
    success: true
    page_url_pattern: "wikipedia.org"

metadata:
  tags:
    - navigation
    - url
    - direct-navigation
  difficulty: easy
  expected_steps: 2
  category: navigation
