id: pagination-001
version: "1.0"
created_at: "2025-02-10"
description: Navigate to the next page of a paginated product listing

input:
  url: https://example.com/products?page=1
  dom_snapshot: |
    <html>
      <head><title>Products - Page 1 - Example Store</title></head>
      <body>
        <header>
          <h1>Example Store</h1>
          <nav>
            <a href="/" id="home-link">Home</a>
            <a href="/products" id="products-link" class="active">Products</a>
            <a href="/cart" id="cart-link">Cart (0)</a>
          </nav>
        </header>
        <main>
          <h2>All Products</h2>
          <div class="product-grid">
            <div class="product-card">
              <h3><a href="/products/wireless-headphones" id="product-1-link">Wireless Headphones</a></h3>
              <p class="price">$79.99</p>
              <button id="add-cart-1" class="btn-secondary">Add to Cart</button>
            </div>
            <div class="product-card">
              <h3><a href="/products/bluetooth-speaker" id="product-2-link">Bluetooth Speaker</a></h3>
              <p class="price">$49.99</p>
              <button id="add-cart-2" class="btn-secondary">Add to Cart</button>
            </div>
            <div class="product-card">
              <h3><a href="/products/usb-charger" id="product-3-link">USB-C Charger</a></h3>
              <p class="price">$24.99</p>
              <button id="add-cart-3" class="btn-secondary">Add to Cart</button>
            </div>
          </div>
          <nav class="pagination" aria-label="Product pages">
            <span class="page current">1</span>
            <a href="/products?page=2" id="page-2-link" class="page">2</a>
            <a href="/products?page=3" id="page-3-link" class="page">3</a>
            <a href="/products?page=2" id="next-page-link" class="page next">Next</a>
          </nav>
        </main>
      </body>
    </html>
  user_query: "Go to the next page of products"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: click_element
      params:
        id: 12
      reasoning: Click the Next link in the pagination to go to the second page of products
      optional: false

    - tool: read_page
      params: {}
      reasoning: Read the next page to confirm navigation and see the new products
      optional: false

  assistant_text_pattern: "*next page*"
  outcome:
    success: true

metadata:
  tags:
    - pagination
    - navigation
    - click
    - read-page
  difficulty: medium
  expected_steps: 2
  category: navigation
