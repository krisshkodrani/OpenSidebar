id: search-google-001
version: "1.1"
created_at: "2024-01-15"
updated_at: "2025-02-10"
description: Simple Google search task

input:
  url: https://google.com
  dom_snapshot: |
    <html>
      <head><title>Google</title></head>
      <body>
        <div class="search-container">
          <input type="text" id="search-input" name="q" placeholder="Search Google"/>
          <button id="search-btn">Google Search</button>
        </div>
      </body>
    </html>
  user_query: "Search for flights to Paris"
  viewport:
    width: 1280
    height: 720

expected:
  tool_calls:
    - tool: click_element
      params:
        id: 1
      reasoning: Focus the search input field
      optional: true
    - tool: type_text
      params:
        id: 1
        text: "flights to Paris"
        pressEnter: true
      reasoning: Enter the search query and submit via Enter
    - tool: click_element
      params:
        id: 2
      reasoning: Submit the search by clicking the button
      optional: true
  assistant_text_pattern: "I'll search for flights to Paris"
  outcome:
    success: true
    page_url_pattern: "google.com/search"
    page_contains: "flights to Paris"

metadata:
  tags:
    - search
    - navigation
    - text-input
  difficulty: easy
  expected_steps: 2
  category: web-navigation
