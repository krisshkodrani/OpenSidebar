# Hermes Agent configuration for OpenSidebar Lab
# https://github.com/nousresearch/hermes-agent

name: opensidebar-lab-assistant
description: >
  Research assistant for the OpenSidebar browser-agent harness.
  Runs literature reviews, indexes findings, and monitors upstream changes.

# Default model: Kimi K2.5 via Fireworks
model:
  provider: fireworks
  model_id: accounts/fireworks/models/kimi-k2.5
  api_base: https://api.fireworks.ai/inference/v1
  # FIREWORKS_API_KEY loaded from project .env

# Fallback to OpenRouter if Fireworks is down
fallback_model:
  provider: openrouter
  model_id: moonshotai/kimi-k2.5
  # OPENROUTER_API_KEY loaded from project .env

# Persistent memory for cross-session recall
memory:
  enabled: true
  backend: sqlite
  db_path: ../../../data/hermes-memory.sqlite

# Scheduled tasks (cron)
scheduled_tasks:
  - name: literature-review
    description: >
      Scan lab/books/notes/ and lab/research/ for new entries.
      Cross-reference with upstream repos and recent papers.
      Append findings to lab/knowledge/literature-digest.md.
    schedule: "0 9 * * 1"  # Weekly Monday 9am
    enabled: false  # Enable after initial setup

  - name: trace-analysis
    description: >
      Sample recent traces from traces/ directory.
      Identify recurring failure patterns.
      Update lab/knowledge/failure-taxonomy.md.
    schedule: "0 10 * * 3"  # Weekly Wednesday 10am
    enabled: false

  - name: upstream-monitor
    description: >
      Check upstream repos (browser-use, stagehand, skyvern, etc.)
      for new releases, papers, or architectural changes relevant
      to our harness design.
    schedule: "0 8 * * 5"  # Weekly Friday 8am
    enabled: false

# Working directory context
workspace:
  root: ../../..  # OpenSidebar project root
  lab_dir: ../..  # lab/ directory
  knowledge_dir: ../../knowledge
