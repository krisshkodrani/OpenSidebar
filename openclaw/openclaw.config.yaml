# Opinionated OpenClaw backend for OpenSidebar (RFC LP-8, M5).
#
# This is the batteries-included config: install once, OpenClaw becomes the
# strategic brain (memory, scheduling, channels) and OpenSidebar stays the hands
# (the authenticated browser) via the MCP browser host.
#
# NOTE: validate these keys against your installed OpenClaw version — the schema
# below follows the integration spec and may need adjusting to the exact release.

gateway:
  # INVARIANT (RFC LP-8): knowledge memory is loopback-only. Never bind to a
  # public interface; even after moving the gateway to a VPS (M7), the profile /
  # knowledge store stays local — reached over a tunnel, never persisted server-side.
  bind: loopback

tools:
  browser: disabled   # OpenSidebar owns the browser — never use headless Playwright
  exec: disabled      # off by default
  read: scoped        # confined to the workspace below
  write: scoped

workspace:
  root: ~/opensidebar-workspace

skills:
  defaults: [opensidebar, summarize, web-search]
  disabled: [camera, screen-record]

models:
  primary: claude-sonnet-4-6      # deep reasoning / planning (strategic tier)
  fallback: claude-haiku-4-5-20251001

# The OpenSidebar browser MCP host (RFC LP-8, M2). OpenClaw prefers these thick,
# intent-level tools over its built-in browser for anything needing a real
# authenticated session.
mcp_servers:
  - name: opensidebar
    type: stdio
    command: pnpm
    args: ["run", "mcp:browser"]
    capabilities: [browser, dom, authenticated-sessions]
    preferred_for: [web-automation, form-filling, scraping]
