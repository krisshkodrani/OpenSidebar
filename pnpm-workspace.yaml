packages:
  - apps/cloud-service
  - apps/sandbox
  - apps/temporal-spike
  - apps/extension
  - apps/extension/tests/e2e/fixtures/online-shop-pro
  - infra/telemetry
  - infra/control-plane
  - infra/sandbox
  - packages/prompts
  - packages/scenario-contracts
  - packages/scenario-engine
  - packages/sandbox-contracts
  - packages/shared-types
  - packages/trace-sync

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - "@types/node"
  # Exact security patch exception for GHSA advisories in the release audit.
  - "source-map-js@1.2.2"
minimumReleaseAgeStrict: true
resolutionMode: highest
blockExoticSubdeps: true

overrides:
  "@grpc/grpc-js": 1.14.5
  "@modelcontextprotocol/sdk": 1.31.0
  dompurify: 3.4.16
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  "@hono/node-server": 2.1.0
  body-parser: 2.3.0
  baseline-browser-mapping: 2.11.0
  browserslist: 4.28.7
  fast-uri: 3.1.8
  hono: 4.13.7
  ip-address: 10.7.1
  nanoid: 3.3.18
  postcss: 8.5.23
  qs: 6.16.0

allowBuilds:
  "@temporalio/core-bridge": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  nx: true
  # false: protobufjs' postinstall only prints version-scheme warnings about
  # dependents' package.json (it builds and generates nothing), and protobufjs
  # reaches us only via @grpc/grpc-js under the OTel exporters — devDependencies
  # for scripts/otel, never the shipped extension. Skipping it loses a warning.
  # NOTE: pnpm 11 FAILS `install --frozen-lockfile` on an unanswered entry, so
  # this must stay a real boolean — a placeholder here turns CI red on install.
  protobufjs: false
  puppeteer: true
