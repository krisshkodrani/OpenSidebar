<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenSidebar — Microphone Access</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f4; color: #292524; }
    .card { text-align: center; padding: 2rem; max-width: 360px; }
    h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    p { font-size: 0.85rem; color: #78716c; margin-bottom: 1.5rem; }
    .status { font-size: 0.85rem; margin-top: 1rem; }
    .granted { color: #16a34a; }
    .denied { color: #dc2626; }
    button {
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #5a66d6;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4a55c0; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <h2>OpenSidebar needs microphone access</h2>
    <p>This is needed for voice input. You'll only need to do this once.</p>
    <button id="allow-btn">Allow Microphone</button>
    <div id="status" class="status"></div>
  </div>
  <script src="request-mic.js"></script>
</body>
</html>
