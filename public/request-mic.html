<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenSidebar — Microphone Access</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f4; color: #292524; }
    .card { text-align: center; padding: 2rem; max-width: 360px; }
    h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    p { font-size: 0.85rem; color: #78716c; margin-bottom: 1.5rem; }
    .status { font-size: 0.85rem; margin-top: 1rem; }
    .granted { color: #16a34a; }
    .denied { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h2>OpenSidebar needs microphone access</h2>
    <p>This is needed for voice input. You'll only need to do this once.</p>
    <div id="status" class="status">Requesting permission...</div>
  </div>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Permission granted — stop all tracks and close
        stream.getTracks().forEach(t => t.stop());
        status.textContent = 'Permission granted! Closing...';
        status.className = 'status granted';
        setTimeout(() => window.close(), 800);
      } catch (err) {
        status.textContent = 'Permission denied. You can grant it later in Chrome settings.';
        status.className = 'status denied';
        // Close after 3 seconds even on denial
        setTimeout(() => window.close(), 3000);
      }
    })();
  </script>
</body>
</html>
