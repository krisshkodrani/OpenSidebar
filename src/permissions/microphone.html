<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OpenSidebar — Microphone Access</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f5f5f0;
        color: #333;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        max-width: 360px;
        text-align: center;
      }
      h2 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #4338ca;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .status {
        margin-top: 16px;
        font-size: 13px;
      }
      .status.ok {
        color: #16a34a;
      }
      .status.err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Microphone Access</h2>
      <p>
        OpenSidebar needs microphone permission for voice input. Click below to
        grant access — this tab will close automatically.
      </p>
      <button id="grant">Grant Microphone Access</button>
      <div id="status" class="status"></div>
    </div>
    <script>
      const btn = document.getElementById("grant");
      const status = document.getElementById("status");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        status.textContent = "Requesting access...";
        status.className = "status";
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          // Stop tracks immediately — we only needed the permission grant
          stream.getTracks().forEach((t) => t.stop());
          status.textContent = "Permission granted! Closing...";
          status.className = "status ok";
          // Notify the extension and close
          try {
            chrome.runtime.sendMessage({ type: "MIC_PERMISSION_GRANTED" });
          } catch {}
          setTimeout(() => window.close(), 800);
        } catch (err) {
          status.textContent = err.message || "Permission denied";
          status.className = "status err";
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
