<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modal Dismiss Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #333;
      color: white;
      padding: 20px;
      z-index: 9999;
      text-align: center;
    }
    #cookie-banner button {
      margin: 0 10px;
      padding: 8px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Page with Cookie Banner</h1>
  <p>Main content is here.</p>

  <div id="cookie-banner" role="dialog" aria-modal="true">
    <p>We use cookies to improve your experience.</p>
    <button id="onetrust-accept-btn-handler" onclick="
      document.getElementById('cookie-banner').style.display = 'none';
      window.__cookieAccepted = true;
    ">Accept All</button>
    <button onclick="
      document.getElementById('cookie-banner').style.display = 'none';
    ">Reject All</button>
  </div>
</body>
</html>
