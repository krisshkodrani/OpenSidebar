<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Challenge</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { margin-bottom: 8px; }
    .instructions { color: #555; margin-bottom: 24px; }
    #progress { font-size: 1.1em; margin-bottom: 16px; color: #333; }
    #advance-btn {
      padding: 10px 24px;
      font-size: 1em;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    #advance-btn:hover { background: #1d4ed8; }
    #code-section {
      margin-top: 24px;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    #code-section label { display: block; margin-bottom: 8px; font-weight: 500; }
    #code-input {
      padding: 8px;
      font-size: 1em;
      width: 220px;
      margin-right: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }
    #submit-code {
      padding: 8px 18px;
      font-size: 1em;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    #submit-code:hover { background: #15803d; }
    #code-error {
      margin-top: 10px;
      color: #dc2626;
      font-weight: 500;
    }
    #success-banner {
      margin-top: 20px;
      padding: 16px;
      background: #dcfce7;
      border: 2px solid #22c55e;
      border-radius: 8px;
      font-size: 1.3em;
      font-weight: bold;
      color: #166534;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Navigation Challenge</h1>
  <p class="instructions">Click the "Advance" button 3 times to reveal the secret code.</p>

  <div id="progress">Step 0 of 3</div>
  <button id="advance-btn" type="button">Advance</button>
  <div id="challenge-stage"></div>

  <script>
    var SECRET = 'ALPHA-7492';
    var step = 0;

    var progressEl = document.getElementById('progress');
    var advanceBtn = document.getElementById('advance-btn');
    var stageEl = document.getElementById('challenge-stage');
    var codeInput = null;
    var codeErrorEl = null;
    var successBannerEl = null;

    function renderEntryStage() {
      if (document.getElementById('code-section')) return;
      stageEl.innerHTML =
        '<div id="secret-code">Secret code: ' + SECRET + '</div>' +
        '<div id="code-section">' +
        '  <label for="code-input">Enter the secret code</label>' +
        '  <div>' +
        '    <input id="code-input" type="text" placeholder="Enter the secret code" />' +
        '    <button id="submit-code" type="button">Submit Code</button>' +
        '  </div>' +
        '  <div id="code-error"></div>' +
        '</div>';

      codeInput = document.getElementById('code-input');
      codeErrorEl = document.getElementById('code-error');
      document.getElementById('submit-code').addEventListener('click', submitCode);
    }

    function renderSuccess() {
      if (successBannerEl) return;
      successBannerEl = document.createElement('div');
      successBannerEl.id = 'success-banner';
      successBannerEl.textContent = 'Challenge Complete!';
      stageEl.appendChild(successBannerEl);
    }

    function submitCode() {
      var entered = codeInput.value.trim();
      if (entered === SECRET) {
        codeErrorEl.textContent = '';
        renderSuccess();
        window.challengeResult = {
          completed: true,
          code: SECRET,
          timestamp: Date.now()
        };
        return;
      }

      codeErrorEl.textContent = 'Incorrect code. Try again.';
    }

    advanceBtn.addEventListener('click', function () {
      step++;
      progressEl.textContent = 'Step ' + step + ' of 3';

      if (step >= 3) {
        advanceBtn.style.display = 'none';
        renderEntryStage();
      }
    });
  </script>
</body>
</html>
