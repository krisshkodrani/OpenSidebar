<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Commerce Shop</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .product { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
    .product h3 { margin: 0 0 8px; }
    .product .price { color: #e63946; font-size: 1.2em; font-weight: bold; }
    .product button { margin-top: 10px; padding: 8px 16px; cursor: pointer; background: #2a9d8f; color: white; border: none; border-radius: 4px; }
    .cart { border: 1px solid #ddd; padding: 15px; margin-bottom: 30px; border-radius: 8px; background: #f8f8f8; }
    .cart h2 { margin-top: 0; }
    .cart-items { min-height: 30px; }
    .cart-item { display: flex; justify-content: space-between; padding: 5px 0; }
    .cart-total { font-weight: bold; font-size: 1.1em; margin-top: 10px; border-top: 1px solid #ccc; padding-top: 10px; }
    .checkout { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
    .checkout h2 { margin-top: 0; }
    .checkout .field { margin: 10px 0; }
    .checkout label { display: block; margin-bottom: 4px; font-weight: bold; }
    .checkout input { width: 100%; padding: 8px; box-sizing: border-box; }
    .checkout button { margin-top: 15px; padding: 10px 24px; background: #e63946; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
    #order-confirmation { display: none; margin-top: 20px; padding: 15px; background: #d4edda; border: 1px solid #c3e6cb; border-radius: 4px; color: #155724; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Shop</h1>

  <div class="products">
    <div class="product" data-name="Bluetooth Speaker" data-price="49.99">
      <h3>Bluetooth Speaker</h3>
      <div class="price">$49.99</div>
      <button onclick="addToCart('Bluetooth Speaker', 49.99)">Add to Cart</button>
    </div>
    <div class="product" data-name="Wireless Headphones" data-price="79.99">
      <h3>Wireless Headphones</h3>
      <div class="price">$79.99</div>
      <button onclick="addToCart('Wireless Headphones', 79.99)">Add to Cart</button>
    </div>
    <div class="product" data-name="USB-C Cable" data-price="12.99">
      <h3>USB-C Cable</h3>
      <div class="price">$12.99</div>
      <button onclick="addToCart('USB-C Cable', 12.99)">Add to Cart</button>
    </div>
  </div>

  <div class="cart">
    <h2>Cart</h2>
    <div id="cart-items" class="cart-items">
      <p id="cart-empty">Your cart is empty.</p>
    </div>
    <div id="cart-total" class="cart-total" style="display:none;">
      Total: $<span id="cart-total-value">0.00</span>
    </div>
  </div>

  <div class="checkout">
    <h2>Checkout</h2>
    <div class="field">
      <label for="checkout-name">Name</label>
      <input id="checkout-name" type="text" placeholder="Your name" />
    </div>
    <div class="field">
      <label for="checkout-address">Address</label>
      <input id="checkout-address" type="text" placeholder="Shipping address" />
    </div>
    <div class="field">
      <label for="checkout-card">Card Number</label>
      <input id="checkout-card" type="text" placeholder="Card number" />
    </div>
    <button id="checkout-submit" onclick="submitOrder()">Place Order</button>
  </div>

  <div id="order-confirmation">Order confirmed! Thank you for your purchase.</div>

  <script>
    const cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      renderCart();
    }

    function renderCart() {
      const itemsEl = document.getElementById('cart-items');
      const emptyEl = document.getElementById('cart-empty');
      const totalEl = document.getElementById('cart-total');
      const totalValEl = document.getElementById('cart-total-value');

      if (cart.length === 0) {
        emptyEl.style.display = '';
        totalEl.style.display = 'none';
        itemsEl.innerHTML = '<p id="cart-empty">Your cart is empty.</p>';
        return;
      }

      emptyEl?.remove();
      let html = '';
      let total = 0;
      for (const item of cart) {
        html += `<div class="cart-item"><span>${item.name}</span><span>$${item.price.toFixed(2)}</span></div>`;
        total += item.price;
      }
      itemsEl.innerHTML = html;
      totalEl.style.display = '';
      totalValEl.textContent = total.toFixed(2);
    }

    function submitOrder() {
      const name = document.getElementById('checkout-name').value;
      const address = document.getElementById('checkout-address').value;
      const card = document.getElementById('checkout-card').value;

      if (!name || !address || !card || cart.length === 0) return;

      document.getElementById('order-confirmation').style.display = 'block';
    }
  </script>
</body>
</html>
