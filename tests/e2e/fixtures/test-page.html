<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E2E Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .hidden-btn { display: none; }
    #click-result { margin-top: 10px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Test Page</h1>

  <button id="test-btn" onclick="document.getElementById('click-result').textContent = 'Clicked!'">
    Click Me
  </button>
  <div id="click-result"></div>

  <input id="test-input" type="text" placeholder="Type here..." />

  <a id="test-link" href="#anchor">Test Link</a>

  <select id="test-select">
    <option value="a">Option A</option>
    <option value="b">Option B</option>
    <option value="c">Option C</option>
  </select>

  <textarea id="test-textarea" rows="3" cols="30" placeholder="Textarea..."></textarea>

  <button class="hidden-btn" id="hidden-btn">Hidden Button</button>
</body>
</html>
