<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .input-row input { flex: 1; padding: 8px; }
    .input-row button { padding: 8px 16px; cursor: pointer; }
    .todo-list { list-style: none; padding: 0; }
    .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .todo-item.completed span { text-decoration: line-through; color: #999; }
    .todo-item span { flex: 1; }
    .todo-item .delete-btn { background: none; border: none; color: #e63946; cursor: pointer; font-size: 1.2em; padding: 0 4px; }
    .todo-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    #counter { margin-top: 15px; color: #666; }
  </style>
</head>
<body>
  <h1>Todo List</h1>

  <div class="input-row">
    <input id="todo-input" type="text" placeholder="Add a new task..." />
    <button id="add-btn" onclick="addTodo()">Add</button>
  </div>

  <ul id="todo-list" class="todo-list"></ul>
  <div id="counter"></div>

  <script>
    let todos = [
      { text: 'Buy groceries', completed: false },
      { text: 'Call dentist', completed: false },
    ];

    function render() {
      const list = document.getElementById('todo-list');
      list.innerHTML = '';

      for (let i = 0; i < todos.length; i++) {
        const todo = todos[i];
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.completed ? ' completed' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.onchange = () => toggleTodo(i);

        const span = document.createElement('span');
        span.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '\u00d7';
        deleteBtn.onclick = () => deleteTodo(i);

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      }

      const incomplete = todos.filter(t => !t.completed).length;
      document.getElementById('counter').textContent =
        incomplete === 1 ? '1 item left' : `${incomplete} items left`;
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, completed: false });
      input.value = '';
      render();
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      render();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      render();
    }

    // Handle Enter key in input
    document.getElementById('todo-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
